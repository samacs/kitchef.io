---
# sidekiq-cron schedule. Loaded by config/initializers/sidekiq.rb when this
# file exists. Times are UTC — the cron library doesn't take a TZ per job,
# so keep jobs self-interpreting of local time where it matters.

pickup_reminder_scan:
  description: "Ping operators + customers when a pickup pedido goes stale in 'ready'"
  cron: "*/15 * * * *"
  class: "PickupReminderScanJob"
  queue: low

clear_expired_vacations:
  description: "Phase 14, Slice 8 — auto-clear Schedule#vacation_until for kitchens whose pause window has ended"
  cron: "0 9 * * *"   # 03:00 America/Mexico_City (UTC−6 standard)
  class: "Schedules::ClearExpiredVacationsJob"
  queue: low
