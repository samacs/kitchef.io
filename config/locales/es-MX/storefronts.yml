      default_body_html: "Estamos en pausa. Reanudamos pedidos el <strong>%{date}</strong>."

    # --- Hero + root page --------------------------------------------
    hero:
      view_menu_cta: "Ver menú"
      reveal_more: "Ver más"
      reveal_less: "Ver menos"

    show:
