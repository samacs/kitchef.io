      menu_title_prefix: "Hoy"
      menu_title_accent: "ofrecemos"
      view_full_menu: "Ver todo el menú"

    # --- Info strip --------------------------------------------------
    info_strip:
      hours_kicker: "Horarios"
      hours_title: "Cuándo abrimos"
      hours_empty: "Configura tus horarios para que tus clientes sepan cuándo llegarles su pedido."
